<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>算法 2.0 · 镜面边界与人像屏蔽描点标定</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #090d14;
      --panel: #121824;
      --panel-2: #182030;
      --line: #273449;
      --text: #eef4fb;
      --muted: #8d9caf;
      --cyan: #00f0ff;
      --yellow: #f5d04c;
      --green: #40d68b;
      --red: #ff6e73;
      --shadow: 0 16px 40px rgba(0, 0, 0, 0.4);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      background: rgba(18, 24, 36, 0.95);
      border-bottom: 1px solid var(--line);
      padding: 12px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(10px);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 16px;
      font-weight: 600;
    }
    .badge {
      background: rgba(0, 240, 255, 0.15);
      color: var(--cyan);
      border: 1px solid var(--cyan);
      border-radius: 6px;
      font-size: 11px;
      padding: 2px 8px;
    }
    .header-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .btn {
      background: var(--panel-2);
      color: var(--text);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 7px 15px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s ease;
      text-decoration: none;
    }
    .btn:hover {
      background: #202b3f;
      border-color: var(--cyan);
      color: var(--cyan);
    }
    .btn-primary {
      background: #007799;
      border-color: var(--cyan);
      color: #fff;
    }
    .btn-primary:hover {
      background: var(--cyan);
      color: #000;
    }
    .btn-success {
      background: #1c5234;
      border-color: var(--green);
      color: #e6fff1;
    }
    .btn-success:hover {
      background: var(--green);
      color: #052615;
    }
    main {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 340px;
      gap: 18px;
      padding: 16px 24px;
      max-width: 1720px;
      margin: 0 auto;
      width: 100%;
    }
    .canvas-panel {
      display: flex;
      flex-direction: column;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: var(--shadow);
    }
    .toolbar {
      padding: 10px 16px;
      background: var(--panel-2);
      border-bottom: 1px solid var(--line);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .frame-controls {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .frame-slider {
      width: 180px;
      accent-color: var(--cyan);
    }
    .frame-number {
      width: 56px;
      padding: 4px 6px;
      background: var(--bg);
      border: 1px solid var(--line);
      border-radius: 6px;
      color: var(--text);
      text-align: center;
      font-size: 13px;
    }
    .canvas-container {
      flex: 1;
      min-height: 540px;
      position: relative;
      background: #05070a;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      padding: 10px;
    }
    canvas {
      display: block;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.6);
      border-radius: 4px;
      cursor: crosshair;
    }
    .side-panel {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 16px;
      box-shadow: var(--shadow);
    }
    .card-title {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .mode-toggle {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      background: var(--bg);
      padding: 4px;
      border-radius: 8px;
      border: 1px solid var(--line);
      margin-bottom: 12px;
    }
    .mode-btn {
      padding: 7px 10px;
      border: none;
      background: transparent;
      color: var(--muted);
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.15s ease;
    }
    .mode-btn.active.mirror {
      background: rgba(0, 240, 255, 0.2);
      color: var(--cyan);
      box-shadow: 0 2px 8px rgba(0, 240, 255, 0.2);
    }
    .mode-btn.active.mask {
      background: rgba(255, 110, 115, 0.2);
      color: var(--red);
      box-shadow: 0 2px 8px rgba(255, 110, 115, 0.2);
    }
    .preview-box {
      width: 100%;
      aspect-ratio: 540 / 720;
      background: #000;
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      transition: aspect-ratio 0.2s ease;
    }
    .preview-box.sbs {
      aspect-ratio: 1080 / 720;
    }
    .preview-box canvas {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    .preview-mode-bar {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      margin-bottom: 8px;
    }
    .preview-mode-btn {
      padding: 5px 8px;
      border: 1px solid var(--line);
      background: var(--panel-2);
      color: var(--muted);
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      transition: all 0.15s ease;
    }
    .preview-mode-btn:hover {
      border-color: var(--cyan);
      color: var(--text);
    }
    .preview-mode-btn.active {
      background: rgba(0, 240, 255, 0.18);
      border-color: var(--cyan);
      color: var(--cyan);
    }
    .preview-badge-status {
      font-size: 10px;
      padding: 2px 7px;
      border-radius: 4px;
      font-weight: 600;
      letter-spacing: 0.02em;
    }
    .preview-badge-client {
      background: rgba(245, 208, 76, 0.15);
      border: 1px solid rgba(245, 208, 76, 0.4);
      color: var(--yellow);
    }
    .preview-badge-server {
      background: rgba(64, 214, 139, 0.15);
      border: 1px solid rgba(64, 214, 139, 0.4);
      color: var(--green);
    }
    .loupe-overlay {
      position: absolute;
      width: 130px;
      height: 130px;
      border-radius: 50%;
      border: 2px solid var(--cyan);
      box-shadow: 0 0 0 3px rgba(0, 0, 0, 0.8), 0 8px 24px rgba(0, 0, 0, 0.6);
      pointer-events: none;
      overflow: hidden;
      display: none;
      z-index: 50;
      background: #000;
    }
    .loupe-overlay.active {
      display: block;
    }
    .loupe-overlay.mask-mode {
      border-color: var(--red);
    }
    .loupe-overlay canvas {
      width: 100%;
      height: 100%;
      border-radius: 50%;
    }
    .loupe-reticle {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 16px;
      height: 16px;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }
    .loupe-reticle::before, .loupe-reticle::after {
      content: "";
      position: absolute;
      background: #ff6e73;
    }
    .loupe-overlay.mask-mode .loupe-reticle::before,
    .loupe-overlay.mask-mode .loupe-reticle::after {
      background: #00f0ff;
    }
    .loupe-reticle::before {
      top: 0; left: 7px; width: 2px; height: 16px;
    }
    .loupe-reticle::after {
      top: 7px; left: 0; width: 16px; height: 2px;
    }
    .loupe-coord {
      position: absolute;
      bottom: 6px;
      left: 0;
      width: 100%;
      text-align: center;
      font: 10px monospace;
      color: #fff;
      text-shadow: 0 1px 3px #000;
      pointer-events: none;
    }
    .points-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 12px;
    }
    .point-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 10px;
      background: var(--panel-2);
      border: 1px solid var(--line);
      border-radius: 6px;
      font-size: 12px;
      transition: all 0.15s;
    }
    .point-item.active {
      border-color: var(--cyan);
      background: #1c273a;
    }
    .point-item.active-mask {
      border-color: var(--red);
      background: #2b181b;
    }
    .point-coord {
      font-family: monospace;
      color: var(--yellow);
    }
    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: rgba(18, 24, 36, 0.95);
      border: 1px solid var(--cyan);
      border-radius: 8px;
      padding: 12px 20px;
      font-weight: 500;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
      z-index: 1000;
      display: none;
    }
    .toast.show { display: block; animation: fadeIn 0.2s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <a href="/" class="btn" style="padding: 5px 10px; font-size: 12px;">⬅ 控制台</a>
      <span>🪞 算法 2.0 · 镜面边界与正面人像屏蔽描点标定</span>
      <span class="badge" id="videoNameBadge">视频加载中...</span>
    </div>
    <div class="header-actions">
      <div style="display:flex;align-items:center;gap:6px;">
        <span style="font-size:12px;color:var(--muted);">标定机位:</span>
        <select id="streamSelector" class="btn" style="padding:5px 8px;font-size:12px;color:var(--cyan);background:var(--panel-2);font-weight:600;">
          <option value="court01-main">Court 01 Main Camera</option>
        </select>
      </div>
      <button class="btn" id="btnReset" title="重新从配置文件加载">🔄 重载已保存</button>
      <button class="btn" id="btnPreset" title="重置为默认镜面区域">🎯 恢复推荐预设</button>
      <button class="btn btn-success" id="btnSave">💾 保存配置到 roi_config.yaml</button>
    </div>
  </header>

  <main>
    <section class="canvas-panel">
      <div class="toolbar">
        <div class="frame-controls">
          <button class="btn" id="btnPlayPause" title="动态序列播放/暂停 (空格键)">▶ 播放</button>
          <button class="btn" id="btnStepPrev10" title="快退 10 帧">-10F</button>
          <button class="btn" id="btnPrevFrame" title="上一帧 (←)">◀ -1F</button>
          <input type="range" class="frame-slider" id="frameSlider" min="0" max="249" value="0">
          <input type="number" class="frame-number" id="frameInput" min="0" max="249" value="0">
          <span style="color:var(--muted);font-size:12px;" id="frameTotalText">/ 250</span>
          <button class="btn" id="btnNextFrame" title="下一帧 (→)">+1F ▶</button>
          <button class="btn" id="btnStepNext10" title="快进 10 帧">+10F</button>
        </div>
        <div style="display:flex;gap:6px;">
          <button class="btn" onclick="jumpTo(36)">击球1 (36)</button>
          <button class="btn" onclick="jumpTo(100)">准备 (100)</button>
          <button class="btn" onclick="jumpTo(132)">击球2 (132)</button>
          <button class="btn" onclick="jumpTo(197)">待机 (197)</button>
        </div>
      </div>
      <div class="canvas-container" id="canvasContainer">
        <canvas id="mainCanvas"></canvas>
        <div class="loupe-overlay" id="loupeOverlay">
          <canvas id="loupeCanvas" width="130" height="130"></canvas>
          <div class="loupe-reticle"></div>
          <div class="loupe-coord" id="loupeCoord">X: 0, Y: 0</div>
        </div>
      </div>
    </section>

    <aside class="side-panel">
      <!-- 标定图层模式选择 -->
      <div class="card">
        <div class="card-title">
          <span>当前标定图层</span>
          <label style="font-size:12px;font-weight:normal;display:flex;align-items:center;gap:4px;cursor:pointer;">
            <input type="checkbox" id="chkMaskEnabled" checked> 启用人像屏蔽
          </label>
        </div>
        <div class="mode-toggle">
          <button class="mode-btn active mirror" id="btnModeMirror">
            <span>🪞 镜面边界 (青)</span>
          </button>
          <button class="mode-btn mask" id="btnModeMask">
            <span>👤 人像屏蔽区 (红)</span>
          </button>
        </div>
        <p style="font-size:12px;color:var(--muted);" id="modeDesc">
          当前正在调整：<b>后墙全景镜面边界多边形</b> (P1~P4)。
        </p>
      </div>

      <div class="card">
        <div class="card-title" style="margin-bottom:8px;">
          <span id="previewCardTitle">算法视角实时动态预览</span>
          <span class="preview-badge-status preview-badge-client" id="previewEngineBadge">⚡ 客户端模拟</span>
        </div>
        <div class="preview-mode-bar">
          <button class="preview-mode-btn active" id="btnPreviewBack" title="540x720 镜像背面特写">
            <span>🪞 镜像特写 (540x720)</span>
          </button>
          <button class="preview-mode-btn" id="btnPreviewSBS" title="1080x720 原图正面与镜像背面合成">
            <span>👥 虚实双视角合成 (1080x720)</span>
          </button>
        </div>
        <div class="preview-box" id="previewBox">
          <canvas id="previewCanvas"></canvas>
        </div>
        <p style="font-size:12px;color:var(--muted);margin-top:8px;" id="previewHint">
          💡 拖拽顶点时即时 60FPS 几何映射模拟，松开或静止时由算法流水线进行透视仿射与屏蔽遮罩高保真真值合成。
        </p>
      </div>

      <div class="card">
        <div class="card-title">
          <span id="pointsListTitle">镜面顶点坐标 (归一化 0~1)</span>
          <button class="btn" style="padding:2px 8px;font-size:11px;" id="btnClearPoints">清空重描</button>
        </div>
        <div class="points-list" id="pointsListContainer">
          <!-- 动态生成 -->
        </div>
        <div style="font-size:12px;color:var(--muted);line-height:1.6;">
          <div><b>快捷操作提示：</b></div>
          <div>• <b>鼠标左键拖拽</b>：拖动当前图层的顶点微调位置</div>
          <div>• <b>点击空白处</b>：重新指定当前激活顶点的坐标</div>
          <div>• <b>S 键</b>：快捷保存当前配置</div>
        </div>
      </div>
    </aside>
  </main>

  <div class="toast" id="toastBox"></div>

  <script>
    const state = {
      videoPath: '',
      width: 2560,
      height: 1440,
      totalFrames: 250,
      currentFrameIndex: 0,
      currentImage: null,
      activeMode: 'mirror', // 'mirror' | 'mask'
      currentStreamId: 'court01-main',
      streams: [],
      maskEnabled: true,
      previewMode: 'back', // 'back' | 'sbs'
      isPlaying: false,
      playbackTimer: null,
      serverPreviewDebounceTimer: null,
      isFetchingServerPreview: false,
      lastServerPreviewUrl: null,
      mirrorPoints: [
        { x: 0.2708, y: 0.4593, label: 'P1 (左下)' },
        { x: 0.2742, y: 0.1018, label: 'P2 (左上)' },
        { x: 0.6139, y: 0.1214, label: 'P3 (右上)' },
        { x: 0.5961, y: 0.4642, label: 'P4 (右下)' }
      ],
      maskPoints: [
        { x: 0.3800, y: 0.2600, label: 'M1 (左上)' },
        { x: 0.4800, y: 0.2600, label: 'M2 (右上)' },
        { x: 0.4800, y: 0.4500, label: 'M3 (右下)' },
        { x: 0.3800, y: 0.4500, label: 'M4 (左下)' }
      ],
      draggingPointIdx: -1,
      hoverPointIdx: -1,
    };

    const mainCanvas = document.getElementById('mainCanvas');
    const mctx = mainCanvas.getContext('2d');
    const previewCanvas = document.getElementById('previewCanvas');
    const pctx = previewCanvas.getContext('2d');
    const toastBox = document.getElementById('toastBox');
    const loupeOverlay = document.getElementById('loupeOverlay');
    const loupeCanvas = document.getElementById('loupeCanvas');
    const loupeCtx = loupeCanvas.getContext('2d');
    const loupeCoord = document.getElementById('loupeCoord');

    function showToast(msg, isSuccess = true) {
      toastBox.innerText = msg;
      toastBox.style.borderColor = isSuccess ? 'var(--green)' : 'var(--red)';
      toastBox.classList.add('show');
      setTimeout(() => toastBox.classList.remove('show'), 3000);
    }

    async function init(targetStreamId = null) {
      try {
        const queryId = targetStreamId || state.currentStreamId;
        const res = await fetch(queryId ? `/api/info?stream_id=${encodeURIComponent(queryId)}` : '/api/info');
        const data = await res.json();
        state.width = data.width || 2560;
        state.height = data.height || 1440;
        state.totalFrames = data.total_frames || 250;
        state.videoPath = data.video_path || '';
        document.getElementById('videoNameBadge').innerText = state.videoPath.split('/').pop() || '40.26.mp4';
        
        document.getElementById('frameSlider').max = state.totalFrames - 1;
        document.getElementById('frameInput').max = state.totalFrames - 1;
        document.getElementById('frameTotalText').innerText = `/ ${state.totalFrames}`;

        // 渲染机位下拉选单
        const mcfg = data.current_config || {};
        if (mcfg.available_streams && mcfg.available_streams.length > 0) {
          state.streams = mcfg.available_streams;
          const sel = document.getElementById('streamSelector');
          sel.innerHTML = state.streams.map(s => 
            `<option value="${s.stream_id}">${s.label || s.stream_id}</option>`
          ).join('');
          if (mcfg.stream_id) {
            sel.value = mcfg.stream_id;
            state.currentStreamId = mcfg.stream_id;
          }
        }

        // 恢复镜面多边形点位
        if (mcfg.polygon && mcfg.polygon.length >= 4) {
          state.mirrorPoints = mcfg.polygon.slice(0, 4).map((pt, i) => ({
            x: pt[0], y: pt[1], label: `P${i+1}`
          }));
        }
        // 恢复正面人像屏蔽点位
        if (mcfg.mask_polygon && mcfg.mask_polygon.length >= 4) {
          state.maskPoints = mcfg.mask_polygon.slice(0, 4).map((pt, i) => ({
            x: pt[0], y: pt[1], label: `M${i+1}`
          }));
          state.maskEnabled = true;
        } else {
          state.maskEnabled = false;
        }
        document.getElementById('chkMaskEnabled').checked = state.maskEnabled;

        renderPointsList();
        loadFrame(0);
      } catch (err) {
        console.error('Init error:', err);
        showToast('加载配置失败，使用默认标定坐标', false);
        loadFrame(0);
      }
    }

    function jumpTo(idx) {
      idx = Math.max(0, Math.min(state.totalFrames - 1, idx));
      document.getElementById('frameSlider').value = idx;
      document.getElementById('frameInput').value = idx;
      loadFrame(idx);
    }

    async function loadFrame(index) {
      state.currentFrameIndex = index;
      document.getElementById('frameInput').value = index;
      document.getElementById('frameSlider').value = index;
      const img = new Image();
      img.src = `/api/frame?index=${index}&t=${Date.now()}`;
      img.onload = () => {
        state.currentImage = img;
        resizeCanvas();
        drawMain();
        drawPreview();
      };
    }

    function resizeCanvas() {
      const container = document.getElementById('canvasContainer');
      const cw = container.clientWidth - 20;
      const ch = container.clientHeight - 20;
      const aspect = state.width / state.height;

      let drawW = cw;
      let drawH = cw / aspect;
      if (drawH > ch) {
        drawH = ch;
        drawW = ch * aspect;
      }
      mainCanvas.width = state.width;
      mainCanvas.height = state.height;
      mainCanvas.style.width = `${drawW}px`;
      mainCanvas.style.height = `${drawH}px`;
    }

    window.addEventListener('resize', () => {
      resizeCanvas();
      drawMain();
    });

    function drawMain() {
      if (!state.currentImage) return;
      mctx.clearRect(0, 0, mainCanvas.width, mainCanvas.height);
      mctx.drawImage(state.currentImage, 0, 0, mainCanvas.width, mainCanvas.height);

      // 1. 绘制镜面边界 (Cyan)
      if (state.mirrorPoints.length >= 3) {
        mctx.beginPath();
        const p0 = toCanvasCoord(state.mirrorPoints[0]);
        mctx.moveTo(p0.x, p0.y);
        for (let i = 1; i < state.mirrorPoints.length; i++) {
          const p = toCanvasCoord(state.mirrorPoints[i]);
          mctx.lineTo(p.x, p.y);
        }
        mctx.closePath();
        mctx.fillStyle = 'rgba(0, 240, 255, 0.16)';
        mctx.fill();
        mctx.strokeStyle = '#00f0ff';
        mctx.lineWidth = state.activeMode === 'mirror' ? 4 : 2;
        mctx.stroke();

        state.mirrorPoints.forEach((pt, idx) => {
          const cp = toCanvasCoord(pt);
          const isHover = state.activeMode === 'mirror' && state.hoverPointIdx === idx;
          const isDrag = state.activeMode === 'mirror' && state.draggingPointIdx === idx;

          mctx.beginPath();
          mctx.arc(cp.x, cp.y, isHover || isDrag ? 14 : 10, 0, Math.PI * 2);
          mctx.fillStyle = isDrag ? '#ff6e73' : (isHover ? '#f5d04c' : '#00f0ff');
          mctx.fill();
          mctx.strokeStyle = '#ffffff';
          mctx.lineWidth = 3;
          mctx.stroke();

          mctx.fillStyle = '#ffffff';
          mctx.font = 'bold 20px sans-serif';
          mctx.shadowColor = 'rgba(0,0,0,0.8)';
          mctx.shadowBlur = 6;
          mctx.fillText(`P${idx+1}`, cp.x + 14, cp.y - 12);
          mctx.shadowBlur = 0;
        });
      }

      // 2. 绘制正面人像屏蔽区 (Red / Coral)
      if (state.maskEnabled && state.maskPoints.length >= 3) {
        mctx.beginPath();
        const m0 = toCanvasCoord(state.maskPoints[0]);
        mctx.moveTo(m0.x, m0.y);
        for (let i = 1; i < state.maskPoints.length; i++) {
          const p = toCanvasCoord(state.maskPoints[i]);
          mctx.lineTo(p.x, p.y);
        }
        mctx.closePath();
        mctx.fillStyle = 'rgba(255, 110, 115, 0.28)';
        mctx.fill();
        mctx.strokeStyle = '#ff6e73';
        mctx.lineWidth = state.activeMode === 'mask' ? 4 : 2;
        mctx.stroke();

        state.maskPoints.forEach((pt, idx) => {
          const cp = toCanvasCoord(pt);
          const isHover = state.activeMode === 'mask' && state.hoverPointIdx === idx;
          const isDrag = state.activeMode === 'mask' && state.draggingPointIdx === idx;

          mctx.beginPath();
          mctx.arc(cp.x, cp.y, isHover || isDrag ? 14 : 10, 0, Math.PI * 2);
          mctx.fillStyle = isDrag ? '#00f0ff' : (isHover ? '#f5d04c' : '#ff6e73');
          mctx.fill();
          mctx.strokeStyle = '#ffffff';
          mctx.lineWidth = 3;
          mctx.stroke();

          mctx.fillStyle = '#ff6e73';
          mctx.font = 'bold 20px sans-serif';
          mctx.shadowColor = 'rgba(0,0,0,0.9)';
          mctx.shadowBlur = 6;
          mctx.fillText(`M${idx+1}`, cp.x + 14, cp.y - 12);
          mctx.shadowBlur = 0;
        });
      }
    }

    function toCanvasCoord(normPt) {
      return { x: normPt.x * mainCanvas.width, y: normPt.y * mainCanvas.height };
    }
    function toNormCoord(canvasX, canvasY) {
      return {
        x: Math.max(0, Math.min(1, canvasX / mainCanvas.width)),
        y: Math.max(0, Math.min(1, canvasY / mainCanvas.height))
      };
    }

    function scheduleServerPreview(delayMs = 120) {
      if (state.serverPreviewDebounceTimer) {
        clearTimeout(state.serverPreviewDebounceTimer);
      }
      state.serverPreviewDebounceTimer = setTimeout(() => {
        fetchServerPreview();
      }, delayMs);
    }

    async function fetchServerPreview() {
      if (state.isFetchingServerPreview || state.mirrorPoints.length < 4) return;
      state.isFetchingServerPreview = true;
      try {
        const xs = state.mirrorPoints.map(p => p.x);
        const ys = state.mirrorPoints.map(p => p.y);
        const roi = [
          parseFloat(Math.min(...xs).toFixed(4)),
          parseFloat(Math.min(...ys).toFixed(4)),
          parseFloat(Math.max(...xs).toFixed(4)),
          parseFloat(Math.max(...ys).toFixed(4))
        ];
        const polygon = state.mirrorPoints.map(p => [
          parseFloat(p.x.toFixed(4)),
          parseFloat(p.y.toFixed(4))
        ]);
        const maskPolygon = (state.maskEnabled && state.maskPoints.length >= 3)
          ? state.maskPoints.map(p => [parseFloat(p.x.toFixed(4)), parseFloat(p.y.toFixed(4))])
          : [];

        const targetUrl = window.location.pathname.includes('mirror') ? '/api/preview_backview' : '/api/mirror/preview_backview';
        let res = await fetch(targetUrl, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            frame_index: state.currentFrameIndex,
            reflection_roi: roi,
            polygon: polygon,
            mask_polygon: maskPolygon,
            mode: state.previewMode
          })
        });
        if (!res.ok && targetUrl === '/api/preview_backview') {
          res = await fetch('/api/mirror/preview_backview', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              frame_index: state.currentFrameIndex,
              reflection_roi: roi,
              polygon: polygon,
              mask_polygon: maskPolygon,
              mode: state.previewMode
            })
          });
        }
        if (res.ok) {
          const blob = await res.blob();
          const imgUrl = URL.createObjectURL(blob);
          const sImg = new Image();
          sImg.onload = () => {
            previewCanvas.width = sImg.width;
            previewCanvas.height = sImg.height;
            pctx.clearRect(0, 0, sImg.width, sImg.height);
            pctx.drawImage(sImg, 0, 0);
            if (state.lastServerPreviewUrl) URL.revokeObjectURL(state.lastServerPreviewUrl);
            state.lastServerPreviewUrl = imgUrl;
            const badge = document.getElementById('previewEngineBadge');
            if (badge) {
              badge.className = 'preview-badge-status preview-badge-server';
              badge.textContent = '🎯 算法流水线合成';
            }
          };
          sImg.src = imgUrl;
        }
      } catch (err) {
        console.warn('Server preview error:', err);
      } finally {
        state.isFetchingServerPreview = false;
      }
    }

    function drawPreview() {
      if (!state.currentImage || state.mirrorPoints.length < 4) return;
      const isSBS = state.previewMode === 'sbs';
      const targetW = isSBS ? 1080 : 540;
      const targetH = 720;
      previewCanvas.width = targetW;
      previewCanvas.height = targetH;
      pctx.clearRect(0, 0, targetW, targetH);

      // 计算镜面包围盒
      const xs = state.mirrorPoints.map(p => p.x * state.width);
      const ys = state.mirrorPoints.map(p => p.y * state.height);
      const minX = Math.max(0, Math.min(...xs));
      const maxX = Math.min(state.width, Math.max(...xs));
      const minY = Math.max(0, Math.min(...ys));
      const maxY = Math.min(state.height, Math.max(...ys));
      const cropW = Math.max(1, maxX - minX);
      const cropH = Math.max(1, maxY - minY);

      // 离屏裁剪并水平镜像
      const off = document.createElement('canvas');
      off.width = cropW;
      off.height = cropH;
      const offCtx = off.getContext('2d');
      offCtx.drawImage(state.currentImage, minX, minY, cropW, cropH, 0, 0, cropW, cropH);

      const backOffsetX = isSBS ? 540 : 0;

      // 如果是 SBS 模式，左半部分绘制正面视角 (Front View Crop)
      if (isSBS) {
        const frontCropW = state.width * 0.55;
        const frontCropH = state.height * 0.95;
        const frontCropX = (state.width - frontCropW) / 2;
        const frontCropY = state.height * 0.05;
        pctx.drawImage(state.currentImage, frontCropX, frontCropY, frontCropW, frontCropH, 0, 0, 540, 720);

        // 正面水印
        pctx.fillStyle = 'rgba(64, 214, 139, 0.95)';
        pctx.font = 'bold 15px sans-serif';
        pctx.fillText('FRONT VIEW (ORIGINAL)', 16, 28);

        // 分割线
        pctx.strokeStyle = '#273449';
        pctx.lineWidth = 2;
        pctx.beginPath();
        pctx.moveTo(540, 0);
        pctx.lineTo(540, 720);
        pctx.stroke();
      }

      // 右半部分（或单镜面全屏）：水平翻转绘制镜像
      pctx.save();
      pctx.translate(backOffsetX + 540, 0);
      pctx.scale(-1, 1);
      pctx.drawImage(off, 0, 0, cropW, cropH, 0, 0, 540, 720);
      pctx.restore();

      // 实时应用正面人像遮罩 (Mask Zone)
      if (state.maskEnabled && state.maskPoints.length >= 3) {
        pctx.beginPath();
        state.maskPoints.forEach((pt, i) => {
          const x_crop = pt.x * state.width - minX;
          const y_crop = pt.y * state.height - minY;
          const x_flip = (cropW - 1) - x_crop;
          const vx = backOffsetX + (x_flip / cropW) * 540;
          const vy = (y_crop / cropH) * 720;
          if (i === 0) pctx.moveTo(vx, vy);
          else pctx.lineTo(vx, vy);
        });
        pctx.closePath();
        pctx.fillStyle = 'rgba(12, 16, 24, 0.90)';
        pctx.fill();
        pctx.strokeStyle = '#3c506e';
        pctx.lineWidth = 2;
        pctx.stroke();

        // 遮罩提示
        pctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
        pctx.font = 'bold 12px sans-serif';
        const center = state.maskPoints.reduce((acc, p) => ({ x: acc.x + p.x/4, y: acc.y + p.y/4 }), {x:0, y:0});
        const cx_flip = (cropW - 1) - (center.x * state.width - minX);
        const cvx = backOffsetX + (cx_flip / cropW) * 540;
        const cvy = ((center.y * state.height - minY) / cropH) * 720;
        pctx.fillText('👤 屏蔽区 (MASKED)', Math.max(backOffsetX + 10, cvx - 55), cvy);
      }

      // 背面水印标注
      pctx.fillStyle = 'rgba(0, 220, 255, 0.95)';
      pctx.font = 'bold 15px sans-serif';
      pctx.fillText('BACK VIEW (FLIPPED)', backOffsetX + 16, 28);

      // 设置客户端模拟角标
      const badge = document.getElementById('previewEngineBadge');
      if (badge) {
        badge.className = 'preview-badge-status preview-badge-client';
        badge.textContent = '⚡ 实时模拟';
      }

      // 防抖触发服务端算法真值渲染
      scheduleServerPreview(120);
    }

    function updateLoupe(point, label) {
      if (!point || !state.currentImage || !loupeOverlay) {
        hideLoupe();
        return;
      }
      const rawX = point.x * state.width;
      const rawY = point.y * state.height;
      const canvPt = toCanvasCoord(point);

      loupeCanvas.width = 130;
      loupeCanvas.height = 130;
      loupeCtx.clearRect(0, 0, 130, 130);

      const cropSize = 34;
      const srcX = Math.max(0, Math.min(state.width - cropSize, rawX - cropSize / 2));
      const srcY = Math.max(0, Math.min(state.height - cropSize, rawY - cropSize / 2));
      loupeCtx.drawImage(state.currentImage, srcX, srcY, cropSize, cropSize, 0, 0, 130, 130);

      const rect = mainCanvas.getBoundingClientRect();
      const contRect = document.getElementById('canvasContainer').getBoundingClientRect();
      const screenX = rect.left - contRect.left + (canvPt.x / mainCanvas.width) * rect.width;
      const screenY = rect.top - contRect.top + (canvPt.y / mainCanvas.height) * rect.height;

      let loupeX = screenX + 25;
      let loupeY = screenY - 145;
      if (loupeY < 10) loupeY = screenY + 25;
      if (loupeX + 140 > contRect.width) loupeX = screenX - 145;

      loupeOverlay.style.left = `${loupeX}px`;
      loupeOverlay.style.top = `${loupeY}px`;
      loupeOverlay.className = `loupe-overlay active ${state.activeMode === 'mask' ? 'mask-mode' : ''}`;
      loupeCoord.textContent = `${label} [${Math.round(rawX)}, ${Math.round(rawY)}]`;
    }

    function hideLoupe() {
      if (loupeOverlay) loupeOverlay.classList.remove('active');
    }

    function togglePlayback() {
      if (state.isPlaying) {
        stopPlayback();
      } else {
        startPlayback();
      }
    }

    function startPlayback() {
      state.isPlaying = true;
      const btn = document.getElementById('btnPlayPause');
      if (btn) {
        btn.textContent = '⏸ 暂停';
        btn.classList.add('btn-primary');
      }
      state.playbackTimer = setInterval(() => {
        const next = (state.currentFrameIndex + 1) % state.totalFrames;
        jumpTo(next);
      }, 45);
    }

    function stopPlayback() {
      state.isPlaying = false;
      const btn = document.getElementById('btnPlayPause');
      if (btn) {
        btn.textContent = '▶ 播放';
        btn.classList.remove('btn-primary');
      }
      if (state.playbackTimer) {
        clearInterval(state.playbackTimer);
        state.playbackTimer = null;
      }
    }

    function getActivePoints() {
      return state.activeMode === 'mirror' ? state.mirrorPoints : state.maskPoints;
    }

    function renderPointsList() {
      const container = document.getElementById('pointsListContainer');
      const title = document.getElementById('pointsListTitle');
      const pts = getActivePoints();
      const isMirror = state.activeMode === 'mirror';

      title.innerText = isMirror ? '镜面顶点 (P1~P4)' : '人像屏蔽区顶点 (M1~M4)';
      container.innerHTML = '';

      pts.forEach((pt, i) => {
        const item = document.createElement('div');
        const activeClass = isMirror ? 'active' : 'active-mask';
        item.className = `point-item ${state.hoverPointIdx === i ? activeClass : ''}`;
        const pLabel = isMirror ? `P${i+1}` : `M${i+1}`;
        item.innerHTML = `
          <span><b>${pLabel}</b> ${pt.label || ''}</span>
          <span class="point-coord">[${pt.x.toFixed(4)}, ${pt.y.toFixed(4)}]</span>
        `;
        item.onmouseenter = () => { state.hoverPointIdx = i; drawMain(); };
        item.onmouseleave = () => { state.hoverPointIdx = -1; drawMain(); };
        container.appendChild(item);
      });
    }

    // 模式切换
    document.getElementById('btnModeMirror').addEventListener('click', () => {
      state.activeMode = 'mirror';
      document.getElementById('btnModeMirror').classList.add('active');
      document.getElementById('btnModeMask').classList.remove('active');
      document.getElementById('modeDesc').innerHTML = '当前正在调整：<b>后墙全景镜面边界多边形</b> (P1~P4)。';
      renderPointsList();
      drawMain();
    });

    document.getElementById('btnModeMask').addEventListener('click', () => {
      state.activeMode = 'mask';
      document.getElementById('btnModeMask').classList.add('active');
      document.getElementById('btnModeMirror').classList.remove('active');
      document.getElementById('modeDesc').innerHTML = '当前正在调整：<b>正面人像/重影屏蔽多边形</b> (M1~M4)。';
      renderPointsList();
      drawMain();
    });

    document.getElementById('chkMaskEnabled').addEventListener('change', (e) => {
      state.maskEnabled = e.target.checked;
      drawMain();
      drawPreview();
    });

    // 交互拖拽
    mainCanvas.addEventListener('mousedown', (e) => {
      const rect = mainCanvas.getBoundingClientRect();
      const scaleX = mainCanvas.width / rect.width;
      const scaleY = mainCanvas.height / rect.height;
      const mx = (e.clientX - rect.left) * scaleX;
      const my = (e.clientY - rect.top) * scaleY;

      let hitIdx = -1;
      const pts = getActivePoints();
      pts.forEach((pt, i) => {
        const cp = toCanvasCoord(pt);
        const dist = Math.hypot(cp.x - mx, cp.y - my);
        if (dist <= 26) hitIdx = i;
      });

      if (hitIdx !== -1) {
        state.draggingPointIdx = hitIdx;
        const prefix = state.activeMode === 'mirror' ? 'P' : 'M';
        updateLoupe(pts[hitIdx], `${prefix}${hitIdx + 1}`);
      }
    });

    window.addEventListener('mousemove', (e) => {
      const rect = mainCanvas.getBoundingClientRect();
      if (rect.width === 0) return;
      const scaleX = mainCanvas.width / rect.width;
      const scaleY = mainCanvas.height / rect.height;
      const mx = (e.clientX - rect.left) * scaleX;
      const my = (e.clientY - rect.top) * scaleY;
      const pts = getActivePoints();

      if (state.draggingPointIdx !== -1) {
        const norm = toNormCoord(mx, my);
        pts[state.draggingPointIdx].x = norm.x;
        pts[state.draggingPointIdx].y = norm.y;
        drawMain();
        drawPreview();
        renderPointsList();
        const prefix = state.activeMode === 'mirror' ? 'P' : 'M';
        updateLoupe(pts[state.draggingPointIdx], `${prefix}${state.draggingPointIdx + 1}`);
      } else {
        let hoverIdx = -1;
        pts.forEach((pt, i) => {
          const cp = toCanvasCoord(pt);
          if (Math.hypot(cp.x - mx, cp.y - my) <= 22) hoverIdx = i;
        });
        if (state.hoverPointIdx !== hoverIdx) {
          state.hoverPointIdx = hoverIdx;
          drawMain();
          if (hoverIdx !== -1) {
            const prefix = state.activeMode === 'mirror' ? 'P' : 'M';
            updateLoupe(pts[hoverIdx], `${prefix}${hoverIdx + 1}`);
          } else {
            hideLoupe();
          }
        } else if (hoverIdx !== -1) {
          const prefix = state.activeMode === 'mirror' ? 'P' : 'M';
          updateLoupe(pts[hoverIdx], `${prefix}${hoverIdx + 1}`);
        }
      }
    });

    window.addEventListener('mouseup', () => {
      if (state.draggingPointIdx !== -1) {
        state.draggingPointIdx = -1;
        drawMain();
        drawPreview();
        scheduleServerPreview(10);
      }
      hideLoupe();
    });

    mainCanvas.addEventListener('mouseleave', () => {
      if (state.draggingPointIdx === -1) {
        state.hoverPointIdx = -1;
        drawMain();
        hideLoupe();
      }
    });

    // 预览模式切换 (单镜像特写 vs 虚实双视角合成)
    document.getElementById('btnPreviewBack').addEventListener('click', () => {
      state.previewMode = 'back';
      document.getElementById('btnPreviewBack').classList.add('active');
      document.getElementById('btnPreviewSBS').classList.remove('active');
      document.getElementById('previewBox').classList.remove('sbs');
      drawPreview();
      scheduleServerPreview(10);
    });

    document.getElementById('btnPreviewSBS').addEventListener('click', () => {
      state.previewMode = 'sbs';
      document.getElementById('btnPreviewSBS').classList.add('active');
      document.getElementById('btnPreviewBack').classList.remove('active');
      document.getElementById('previewBox').classList.add('sbs');
      drawPreview();
      scheduleServerPreview(10);
    });

    // 帧导航与多帧播放事件
    document.getElementById('frameSlider').addEventListener('input', (e) => {
      loadFrame(parseInt(e.target.value));
    });
    document.getElementById('frameInput').addEventListener('change', (e) => {
      jumpTo(parseInt(e.target.value));
    });
    document.getElementById('btnPrevFrame').addEventListener('click', () => {
      jumpTo(state.currentFrameIndex - 1);
    });
    document.getElementById('btnNextFrame').addEventListener('click', () => {
      jumpTo(state.currentFrameIndex + 1);
    });
    const stepPrev10 = document.getElementById('btnStepPrev10');
    if (stepPrev10) {
      stepPrev10.addEventListener('click', () => jumpTo(state.currentFrameIndex - 10));
    }
    const stepNext10 = document.getElementById('btnStepNext10');
    if (stepNext10) {
      stepNext10.addEventListener('click', () => jumpTo(state.currentFrameIndex + 10));
    }
    const playPauseBtn = document.getElementById('btnPlayPause');
    if (playPauseBtn) {
      playPauseBtn.addEventListener('click', togglePlayback);
    }

    // 预设与重置
    document.getElementById('btnPreset').addEventListener('click', () => {
      state.mirrorPoints = [
        { x: 0.2708, y: 0.4593, label: 'P1 (左下)' },
        { x: 0.2742, y: 0.1018, label: 'P2 (左上)' },
        { x: 0.6139, y: 0.1214, label: 'P3 (右上)' },
        { x: 0.5961, y: 0.4642, label: 'P4 (右下)' }
      ];
      state.maskPoints = [
        { x: 0.3800, y: 0.2600, label: 'M1 (左上)' },
        { x: 0.4800, y: 0.2600, label: 'M2 (右上)' },
        { x: 0.4800, y: 0.4500, label: 'M3 (右下)' },
        { x: 0.3800, y: 0.4500, label: 'M4 (左下)' }
      ];
      drawMain();
      drawPreview();
      renderPointsList();
      showToast('已恢复推荐镜面与屏蔽区预设');
    });

    document.getElementById('btnReset').addEventListener('click', () => {
      init();
      showToast('已重载当前配置文件');
    });

    document.getElementById('btnClearPoints').addEventListener('click', () => {
      if (state.activeMode === 'mirror') {
        state.mirrorPoints = [];
        showToast('已清空镜面角点，请在画面上依次点击 4 个点');
      } else {
        state.maskPoints = [];
        showToast('已清空人像屏蔽区角点，请在画面上依次点击 4 个点');
      }
      drawMain();
      renderPointsList();
    });

    // 点击添加新点
    mainCanvas.addEventListener('click', (e) => {
      const pts = getActivePoints();
      if (state.draggingPointIdx !== -1 || pts.length >= 4) return;
      const rect = mainCanvas.getBoundingClientRect();
      const scaleX = mainCanvas.width / rect.width;
      const scaleY = mainCanvas.height / rect.height;
      const norm = toNormCoord((e.clientX - rect.left) * scaleX, (e.clientY - rect.top) * scaleY);
      const prefix = state.activeMode === 'mirror' ? 'P' : 'M';
      pts.push({ x: norm.x, y: norm.y, label: `${prefix}${pts.length + 1}` });
      drawMain();
      drawPreview();
      renderPointsList();
    });

    // 保存配置
    async function saveConfig() {
      if (state.mirrorPoints.length < 4) {
        showToast('请至少标注 4 个镜面边界角点 (P1~P4)', false);
        return;
      }
      const xs = state.mirrorPoints.map(p => p.x);
      const ys = state.mirrorPoints.map(p => p.y);
      const roi = [
        parseFloat(Math.min(...xs).toFixed(4)),
        parseFloat(Math.min(...ys).toFixed(4)),
        parseFloat(Math.max(...xs).toFixed(4)),
        parseFloat(Math.max(...ys).toFixed(4))
      ];
      const polygon = state.mirrorPoints.map(p => [
        parseFloat(p.x.toFixed(4)),
        parseFloat(p.y.toFixed(4))
      ]);
      const maskPolygon = (state.maskEnabled && state.maskPoints.length >= 3)
        ? state.maskPoints.map(p => [parseFloat(p.x.toFixed(4)), parseFloat(p.y.toFixed(4))])
        : [];

      try {
        const res = await fetch('/api/save_config', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            stream_id: state.currentStreamId,
            reflection_roi: roi,
            polygon: polygon,
            mask_polygon: maskPolygon
          })
        });
        const ret = await res.json();
        if (ret.success) {
          showToast(`✅ 机位 [${ret.stream_id || state.currentStreamId}] 镜面与人像屏蔽已成功保存！`);
        } else {
          showToast(`保存失败: ${ret.error || '未知错误'}`, false);
        }
      } catch (err) {
        showToast(`网络或保存异常: ${err}`, false);
      }
    }

    document.getElementById('btnSave').addEventListener('click', saveConfig);
    document.getElementById('streamSelector').addEventListener('change', (e) => {
      state.currentStreamId = e.target.value;
      init(state.currentStreamId);
    });

    // 快捷键
    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space') {
        const tag = (e.target.tagName || '').toLowerCase();
        if (tag !== 'input' && tag !== 'textarea') {
          e.preventDefault();
          togglePlayback();
        }
      } else if (e.key === 's' || e.key === 'S') {
        if (!e.ctrlKey && !e.metaKey) {
          e.preventDefault();
          saveConfig();
        }
      } else if (e.key === 'ArrowLeft') {
        jumpTo(state.currentFrameIndex - (e.shiftKey ? 10 : 1));
      } else if (e.key === 'ArrowRight') {
        jumpTo(state.currentFrameIndex + (e.shiftKey ? 10 : 1));
      }
    });

    window.onload = () => init();
  </script>
</body>
</html>
