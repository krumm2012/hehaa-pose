video_input_path: "data/input_video.mp4"
video_output_path: "data/output_video.mp4"
yolo_pose_model_path: "models/yolov8n-pose.pt" # 使用最轻量的yolov8n
tracknet_model_path: "models/tracknetv2_weights.pth"

# --- 平衡优化参数 - 恢复球检测和球拍检测功能 ---
pose_confidence_threshold: 0.5  # 适度降低阈值恢复检测
ball_confidence_threshold: 0.75  # 降低阈值恢复球检测 (从0.8降到0.6)
static_ball_movement_threshold_px: 5  # 恢复原始敏感度
static_ball_frames_threshold: 7       # 恢复原始设置

# Swing classification parameters
forehand_wrist_elbow_angle_min: 90
forehand_wrist_elbow_angle_max: 170
backhand_wrist_elbow_angle_min: 90
backhand_wrist_elbow_angle_max: 170
two_hand_wrist_distance_max_px: 50
dominant_hand: "right"

# Ball tracking and filtering parameters - 恢复功能平衡
ball_trajectory_max_len: 30             # 适度增加轨迹长度
max_lost_frames_for_track: 5            # 恢复跟踪帧数
max_ball_match_distance_px: 25          # 恢复更精确的匹配距离
static_ball_movement_threshold_px: 5    # 恢复原始阈值
static_ball_frames_threshold: 8         # 恢复原始设置

# Ball size filtering parameters - 放宽过滤条件
min_ball_radius: 3                      # 恢复原始最小半径
max_ball_radius: 30                     # 恢复原始最大半径
min_ball_movement: 8                    # 恢复原始最小移动距离

# 监控区域边界（矩形）- 修复边界设置
use_boundary: true
boundary_x1: 650                    # 扩大左边界 (从650改为400)
boundary_y1: 410                    # 扩大上边界 (从410改为200) 
boundary_x2: 1420                   # 扩大右边界 (从1420改为1500)
boundary_y2: 980                   # 保持下边界
draw_boundary: true                  # 启用边界显示以便调试

# 显示控制 - 恢复重要功能
draw_static_balls: false

# Simulation specific parameters
sim_ball_detection_noise: 3             # 恢复原始噪音容忍度
sim_num_static_balls: 0

# 字体配置
font_dir: "fonts"
preferred_chinese_font: "PingFang SC"
auto_download_font: false

# Racket Detector Configs - 恢复球拍检测功能
racket_yolo_model_path: "yolov8n.pt"    # 使用轻量模型
racket_confidence_threshold: 0.4        # 恢复原始置信度阈值 (从0.6降到0.4)
racket_lost_threshold_frames: 5         # 恢复原始阈值
ball_radius_px: 10

enable_manual_boundary: False

# 🔄 视频文本显示控制 - 恢复重要功能
display_options:
  show_swing_type: true      # 保留核心功能
  show_ball_position: true   # 保留核心功能
  show_racket_state: true    # ✅ 恢复球拍状态显示
  show_pose_keypoints: true  # 保留核心功能
  show_ball_trajectory: true # ✅ 恢复球轨迹显示
  show_boundary: false
  show_static_balls: false
  show_fps: true            # 启用FPS监控
  show_frame_number: false

# 🚀 高级人脸检测器配置 - 性能优化版本（保持优化）
advanced_face_detection:
  detection_priority: ["enhanced_opencv"]
  
  detector_control:
    enable_front_face: true              
    enable_front_face_alt: false         
    enable_front_face_alt2: false        
    enable_profile_face: false           
    enable_full_body: false              
  
  opencv_detection_params:
    front_face:
      scale_factor: 1.3                  
      min_neighbors: 2                   
      confidence: 0.7                    
  
  face_size_constraints:
    min_face_size: 40                    
    max_face_size: 120                   
    min_aspect_ratio: 0.6                
    max_aspect_ratio: 1.8                
    relative_max_size: 0.3               
  
  quality_assessment:
    contrast_normalization_factor: 60.0   
    target_brightness: 128
    brightness_tolerance: 100              
    canny_low_threshold: 60               
    canny_high_threshold: 180             
    edge_density_factor: 8.0              
    size_normalization_factor: 8000.0     
  
  quality_filters:
    min_confidence: 0.7                   
    min_quality_score: 0.3                
    enable_opencv_quality_filter: false   
    max_detections_per_frame: 1           
    enable_nms: true                      
    nms_iou_threshold: 0.5                
  
  detection_merging:
    overlap_threshold: 0.4                
    min_overlap_for_merge: 0.4           
  
  face_tracking:
    enable_tracking: true                 
    max_disappeared_frames: 15            
    max_match_distance: 80                
    smoothing_factor: 0.8                 
    position_smooth_alpha: 0.8            
  
  position_constraints:
    exclude_edges: false
    edge_margin_ratio: 0.05
    center_bias_weight: 0.0
    max_distance_from_center: 1.0
    center_preference: false
    center_weight: 1.0
    exclude_logo_areas: false
    logo_exclusion_zones: []
  
  mtcnn:
    enabled: false                       

# GLIP模型配置 - 保持禁用
glip_model:
  enabled: false                          

# 头像替换配置 - 保持禁用以维持性能
face_replacement:
  enabled: false                         
  judy_head_image_path: "assets/judy_head.png"
  judy_head_scale_factor: 0.8
  blend_mode: "alpha"
  face_detection_method: "opencv"
  replacement_opacity: 0.95
  face_margin_ratio: 0.05
  smooth_transition: true
  track_faces: true

# 调试选项
debug_mode: false
# 🔍 球检测详细日志配置
ball_detection_debug:
  enabled: true                          # 启用球检测调试日志
  log_hsv_detection: true               # 记录HSV颜色检测过程
  log_boundary_check: true              # 记录边界检查过程
  log_size_filtering: true              # 记录尺寸过滤过程
  log_static_filtering: true            # 记录静态球过滤过程
  log_advanced_processing: true         # 记录高级球处理过程
  log_simulation: true                  # 记录模拟检测过程
  save_debug_frames: false              # 是否保存调试帧图像
  debug_frame_interval: 10              # 调试帧保存间隔
  max_log_detections: 10                # 每帧最多记录的检测数量 