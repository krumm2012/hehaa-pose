# YOLO26-pose 配置文件

# ==================== 基础视频设置 ====================
video_input_path: "data/input_video.mp4"
video_output_path: "data/output_video.mp4"
save_video: true                               # 是否保存结果视频

# ==================== 🤖 姿态模型与时序平滑 ====================
yolo_pose_model_path: "yolo26m-pose.mlpackage"
pose_compute_units: "ALL"                      # 显式沿用原双视角实际后端；ANE 独占对照未带来收益
pose_confidence_threshold: 0.4                 # 姿态检测置信度阈值
pose_keypoint_confidence: 0.3                  # 关键点置信度阈值
pose_smoothing_enabled: true                   # 关键点时序平滑开关
pose_smoothing_alpha: 0.45                     # EMA 平滑系数（越小越稳，越大越跟手）
pose_smoothing_max_jump_px: 90                 # 单帧最大跳变限幅
pose_smoothing_hold_missing_frames: 2          # 短时丢点时保持上一帧关键点
pose_smoothing_reset_frames: 8                 # 连续无人帧后重置平滑状态
pose_smoothing_min_valid_points: 5             # 有效关键点太少时不做平滑更新
pose_estimation_debug:
  log_keypoints: false                         # 关键点日志
  log_tracking: true                           # 姿态追踪日志
  use_roi_detection: false                     # 是否在ROI区域内检测姿态（false=全帧检测，推荐）

# ==================== 🏓 七点球拍姿态配置 ====================
racket_pose:
  ipc_transport: queue                         # queue / shared_memory；共享源帧仅连续模式，实验验收后启用
  mode: legacy                                 # 启动方案 legacy / exclusive（七点独占）；shadow / active 保留兼容诊断
  # 原始交付模型有非有限 BN 统计及 FP16 解码溢出；保留原包，使用独立验收候选。
  model_path: models/racket_pose/candidates/bn-recalibrated-v1/racket_pose_validated_fp16.mlpackage
  acceptance_path: models/racket_pose/candidates/bn-recalibrated-v1/acceptance-release.json
  runtime_acceptance_path: models/racket_pose/candidates/bn-recalibrated-v1/pipeline-acceptance.json
  acceptance_run: false                        # 仅验收脚本显式开启；日常增强须匹配三轮整链路验收配置
  use_accepted_schedule: true                  # 使用对应单/双视角已通过验收的最高推理频率
  backend: coreml
  compute_units: ANE
  imgsz: 960
  confidence_threshold: 0.25
  keypoint_threshold: 0.5
  inference_stride: 1
  join_ms: 8
  timeout_seconds: 10

# ==================== 🎯 YOLO26n 统一检测配置 ====================
# 注：其余轨迹连续性、静止球屏蔽与拍-球加权参数均在 ball_candidate_selector.py /
# static_ball_filter.py / racket_candidate_selector.py / ball_track_selector.py 中内置相同校准默认值，
# 需要针对特定球场调优时可按需在此覆写。
unified_detection:
  enabled: true                                # 启用统一检测（替代 HSV + YOLOv8n）
  model_path: "models/detectors/tennis-yolo26n-exp004-960-fp16/model.mlpackage"
  ball_class_id: 0                             # 两类微调模型 tennis_ball
  racket_class_id: 1                           # 两类微调模型 tennis_racket
  coreml_detection_output: "var_1440"          # exp-004 Core ML 端到端输出
  preprocess_mode: "letterbox"                 # 与 Ultralytics 960 训练/验证预处理保持一致
  ball_confidence_threshold: 0.692             # exp-004 val: P>=0.90 工作点
  racket_confidence_threshold: 0.524           # exp-004 val: P>=0.90 工作点
  compute_units: "ANE"                         # 锁定在 ANE (Neural Engine)
  racket_temporal_recovery_enabled: true
  active_ball_motion_filter_enabled: true      # 静止主球解锁、静态锚点运动证据门控
  ball_max_motion_for_continuity_px: 140       # 前后帧位移超过该阈值时禁用连续性追踪（防止跳到镜像/幻球）
  ball_min_selected_confidence: 0.05           # 最终主球最低置信度（无连续性/无球拍支撑时）
  ball_play_area_min_y_ratio_hard: 0.35        # 主球硬下限区域（上半镜像区域剔除，需无支撑才生效）
  static_ball_hard_mask_min_seen_frames: 4     # 命中该帧数后进入静态屏蔽区（diagnostics 参考/覆写）
  static_ball_hard_mask_radius_px: 30          # 静态屏蔽区半径
  racket_mirror_min_y_ratio: 0.42              # 顶部镜像拍惩罚阈值（画面高度比例，覆盖镜面区）
  racket_top_mirror_penalty: 0.45              # 顶部镜像拍惩罚权重，防止镜中反射拍压制前景拍

# ==================== 🏸 挥拍分析配置 ====================
swing_analysis:
  enabled: true
  dominant_hand: "right"                       # 球员惯用手: "right" 或 "left"
  mirror_view: true                            # 视角镜像: 球员面向摄像头（左边是右手）时设为 true
  two_hand_wrist_distance_max_px: 60           # 判定双反的手腕距离阈值

# ==================== 🎯 ROI 区域功能 ====================
roi_settings:
  enabled: true
  auto_load_config: true
  roi_config_path: "configs/roi_config.yaml"
  crop_margin: 12
  preview_interval_frames: 25
  visualization:
    show_roi_boundary: false
    show_roi_fill: false
    show_roi_points: true
    highlight_detections: true
    show_roi_stats: true
  logging:
    log_coordinate_adjustment: false
    log_frame_context: false

# ==================== 📹 视频与字体设置 ====================
video_processing:
  output_fps: 25
  max_frames: 0

font_dir: "fonts"

# ==================== 🚄 Pipeline 性能开关 ====================
pipeline_perf:
  pose_resize_policy: legacy                   # direct_front / direct_source 单次缩放候选；legacy保留旧输入像素
  inference_schedule: barrier                  # barrier / interframe；跨帧仅新版独占，最多两帧在途
  processing_mode: buffered                    # 默认连续处理；启动预热后逐帧，不丢旧帧/不采样新球拍
  async_display_enabled: true                  # 独立显示进程；有界背压，逐帧提交，正常结束排空
  inference_workers: 8                         # 推理线程池大小；当前每帧最多并行检测和姿态两个任务
  limit_reader_fps: true                       # Reader按原视频FPS节流（false可提升离线吞吐）
  live_limit_reader_fps: true                  # 直播突发码流按源FPS整形，避免批量读帧导致过度丢帧
  live_reader_max_lag_frames: 1.0              # 源阻塞超过一帧后重置时间线，不追赶式爆发
  reader_buffer_slots: 12                      # 离线模式共享内存槽数量
  live_reader_buffer_slots: 3                  # 直播模式仅保留三阶段各自所需的槽
  live_slot_wait_ms: 2                         # 直播无空槽时等待时长，随后直接跳过源帧
  reader_open_timeout_ms: 5000                 # 实时码流连接超时
  reader_read_timeout_ms: 2000                 # 实时码流单次读取超时
  live_reconnect: true                         # 直播断流后自动重连
  live_reconnect_delay: 0.5                    # 重连间隔（秒）
  video_encoder_backend: auto                  # macOS优先VideoToolbox，不可用时回退OpenCV
  video_encoder_bitrate: 12M                   # 1440p H.264目标码率
  dual_view_enabled: true                      # 双窗口对比显示（关闭可明显提速）
  dual_view_scale: 0.5                         # 双窗口缩放比例
  analysis_stride: 1                           # 每N帧做一次完整挥拍指标分析
  draw_metrics_text: true                      # 绘制详细指标文字
  collect_frame_results: true                  # 累积每帧结果并导出JSON
  json_dump_indent: 4                          # JSON缩进，设为null可减小文件体积
  live_mode: false                             # 直播模式：关闭高开销显示/JSON并优先新帧
  drop_stale_frames: false                     # 处理滞后时丢弃旧帧以降低直播延迟

# ==================== 🎾 实时挥拍事件闭环 ====================
realtime_swing:
  enabled: false                               # 推荐通过 --realtime-swing-events 显式开启
  analysis_interval_frames: 5                  # 每5个已处理帧刷新滚动事件分析
  settle_frames: null                          # null=源PTS等待0.6秒；显式帧数按25Hz参考换算，缺时钟按帧启发式
  window_frames: null                          # null=200条记录上限，源PTS上下文最多8秒；容量不是时间精度
  clip_workers: 1                              # 异步片段编码线程，避免阻塞主分析循环
  clip_padding_frames: 8                       # 每个事件片段前后附加帧数
  clip_max_width: 1280                         # 内存中缓存720p级JPEG，不保存1440p原始帧环
  clip_jpeg_quality: 85                        # 实时片段缓存质量
  frame_output_enabled: false                  # 异步输出逐帧JSONL和最近帧JSON
  frame_snapshot_size: 200                     # 最近帧JSON保留数量
  frame_flush_interval: 5                      # 每5个处理帧刷新逐帧文件
  coach_enabled: false                         # 为每个确认挥拍生成1-3条本地动作纠错
  coach_max_chars: 15                          # 建议硬上限15字
  coach_max_suggestions: 3                     # 每次挥拍最多输出3条，coach_advice仍保留第一条
  coach_min_confidence: 0.45                   # 低于该置信度的生物力学指标不用于技术结论
  coach_biomechanics:
    min_hip_shoulder_separation_deg: 15.0      # 肩髋分离低于此值时提示加强转动
    min_shoulder_turn_deg: 75.0                # 肩部转动不足阈值
    min_arm_extension_deg: 145.0               # 触球窗口手臂伸展不足阈值
    min_contact_lateral_body_widths: 0.55      # 击球点横向距离，小于0.55倍身宽视为太近
    min_weight_transfer_body_widths: 0.08      # 准备到触球身体中心位移下限
    max_balance_drift_body_widths: 0.65        # 触球到结束身体中心漂移上限
  deepseek:
    enabled: false                             # 旁路增强；本地Coach始终先返回
    model: deepseek-v4-flash                   # DeepSeek官方低延迟模型
    base_url: https://api.deepseek.com         # OpenAI兼容ChatCompletions地址
    api_key_env: DEEPSEEK_API_KEY              # 仅从环境变量读取密钥
    timeout_seconds: 3.0                       # HTTP socket 超时；同时用于过期排队任务判断
    workers: 2                                 # 允许相邻挥拍并行请求
    max_pending: 2                             # 最多额外排队任务；满时跳过新请求
    max_chars: 15                              # DeepSeek建议同样不超过15字
  coach_tts:
    enabled: false                             # 可用 --realtime-coach-tts 覆盖；不会阻塞实时推理
    model: mlx-community/Qwen3-TTS-12Hz-0.6B-Base-bf16 # Qwen3-TTS MLX 0.6B
    voice: Vivian                              # 中文预设声音
    language: Chinese
    playback: true                             # 优先流式扬声器；不可用时回退 afplay；关闭后仅写 WAV
    max_pending: 2                             # 队列满时跳过过期播报，保持实时性
    startup_timeout_seconds: 120               # 首次加载及第一条请求总等待上限
    request_timeout_seconds: 30                # 已加载 worker 后每条请求等待上限
    streaming_interval_seconds: 0.32           # Qwen3-TTS 每段音频目标时长；越小首段越快
    streaming_prebuffer_chunks: 2              # 预缓冲两段后播放，吸收推理与设备抖动
  open_report: false                           # 启动时自动打开实时HTML
